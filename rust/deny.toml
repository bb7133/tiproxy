[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
# OpenDAL 0.53.3's S3/GCS signers retain these transitive advisories. This
# foundation is an operator-run, dry-run-only binary with trusted storage
# endpoints; service mode and backend execution fail closed. Revisit the pin
# before either deferred mode is enabled. OpenDAL 0.58 fixes quick-xml but has
# MSRV 1.91, above this workspace's 1.89 toolchain.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
exceptions = [
    { allow = ["CC0-1.0"], crate = "tiny-keccak@2.0.2" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
skip = [
    { crate = "getrandom@0.3.4", reason = "OpenDAL 0.53.3 requires uuid >=1.14 with v4; all other workspace consumers remain on the audited 0.2 API" },
    { crate = "hashbrown@0.14.5", reason = "OpenDAL's AWS signer requires rust-ini 0.21/ordered-multimap 0.7; the workspace graph otherwise uses hashbrown 0.17" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
