[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

# Credential profile parsing pulls this public-domain build dependency.
# Scope the license allowance to the reviewed exact crate/version.
[[licenses.exceptions]]
name = "tiny-keccak"
version = "=2.0.2"
allow = ["CC0-1.0"]

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = true
# Maintained cloud signing libraries use base64 0.23, whereas TLS/tonic use 0.22.
# rust-ini's ordered-multimap still pins hashbrown 0.14; indexmap uses 0.17.
# Keep global duplicate denial; remove these exact exceptions when they converge.
skip = [
    { name = "base64", version = "=0.23.1" },
    { name = "hashbrown", version = "=0.14.5" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
