[package]
name = "control-external"
description = "Fenced external dependency foundation for the TiProxy Rust control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
control-plane.workspace = true
etcd-client = { workspace = true, features = ["raw-channel"] }
futures-util.workspace = true
http.workspace = true
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
prost.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower = { version = "=0.5.3", default-features = false, features = ["balance", "buffer", "util"] }
x509-parser.workspace = true

[dev-dependencies]
rcgen.workspace = true
serde_json.workspace = true

[lints]
workspace = true
