// Minimal wire-compatible projection of kvproto's diagnosticspb.proto.
// Source revision: github.com/pingcap/kvproto b41e86365ce0.
// Go/gogoproto and rustproto code-generation options are intentionally omitted;
// message numbers, enum values, and service paths are unchanged.
syntax = "proto3";
package diagnosticspb;

service Diagnostics {
  rpc search_log(SearchLogRequest) returns (stream SearchLogResponse) {}
  rpc server_info(ServerInfoRequest) returns (ServerInfoResponse) {}
}

enum LogLevel {
  UNKNOWN = 0;
  Debug = 1;
  Info = 2;
  Warn = 3;
  Trace = 4;
  Critical = 5;
  Error = 6;
}

message SearchLogRequest {
  enum Target {
    Normal = 0;
    Slow = 1;
  }
  int64 start_time = 1;
  int64 end_time = 2;
  repeated LogLevel levels = 3;
  repeated string patterns = 4;
  Target target = 5;
}

message SearchLogResponse { repeated LogMessage messages = 1; }

message LogMessage {
  int64 time = 1;
  LogLevel level = 2;
  string message = 3;
}

enum ServerInfoType {
  All = 0;
  HardwareInfo = 1;
  SystemInfo = 2;
  LoadInfo = 3;
}

message ServerInfoRequest { ServerInfoType tp = 1; }

message ServerInfoPair {
  string key = 1;
  string value = 2;
}

message ServerInfoItem {
  string tp = 1;
  string name = 2;
  repeated ServerInfoPair pairs = 3;
}

message ServerInfoResponse { repeated ServerInfoItem items = 1; }
