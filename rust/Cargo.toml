[workspace]
members = [
    "crates/control-config",
    "crates/control-etcd",
    "crates/control-external",
    "crates/control-plane",
    "crates/control-proto",
    "crates/control-topology",
    "crates/dataplane",
    "crates/differential-runner",
    "crates/mysql-wire",
    "crates/proxy-io",
    "crates/session-core",
    "crates/tiproxy-rs",
]
exclude = ["ci/fixtures"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89.0"
license = "Apache-2.0"
repository = "https://github.com/pingcap/tiproxy"

[workspace.dependencies]
crc32fast = { version = "=1.5.1", default-features = false }
getrandom = "=0.2.17"
control-config = { path = "crates/control-config", version = "0.1.0" }
control-external = { path = "crates/control-external", version = "0.1.0" }
control-etcd = { path = "crates/control-etcd", version = "0.1.0" }
control-plane = { path = "crates/control-plane", version = "0.1.0" }
control-proto = { path = "crates/control-proto", version = "0.1.0" }
control-topology = { path = "crates/control-topology", version = "0.1.0" }
criterion = { version = "=0.8.2", default-features = false }
dataplane = { path = "crates/dataplane", version = "0.1.0" }
displaydoc = { version = "=0.2.5", default-features = false }
etcd-client = { version = "=0.20.0", default-features = false, features = ["tls-ring"] }
flate2 = { version = "=1.1.2", default-features = false, features = ["rust_backend"] }
futures-util = { version = "=0.3.31", default-features = false, features = ["std"] }
http = { version = "=1.3.1", default-features = false }
if-addrs = { version = "=0.13.4", default-features = false }
libc = { version = "=0.2.189", default-features = false }
mysql-wire = { path = "crates/mysql-wire", version = "0.1.0" }
proxy-io = { path = "crates/proxy-io", version = "0.1.0" }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
session-core = { path = "crates/session-core", version = "0.1.0" }
prost = { version = "=0.14.1", default-features = false, features = ["derive", "std"] }
rcgen = { version = "=0.14.9", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls-manual-roots", "stream"] }
rustls = { version = "=0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.14.1", default-features = false, features = ["alloc", "std"] }
socket2 = { version = "=0.6.1", default-features = false, features = ["all"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "=1.47.1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
thiserror = { version = "=2.0.17", default-features = false }
toml = { version = "=0.8.23", default-features = false, features = ["display", "parse"] }
tonic = { version = "=0.14.6", default-features = false, features = ["codegen", "server", "transport"] }
tonic-prost = { version = "=0.14.6", default-features = false }
x509-parser = { version = "=0.18.1", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
zstd-pure-rs = { version = "=0.1.2", default-features = false, features = ["std"] }
zstd-zero = { version = "=0.1.0", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.metadata.tiproxy]
default-feature-policy = "Default features stay empty; deployment-specific behavior requires an explicit, additive feature."
protocol-policy = "MySQL packet payloads stay inside the Rust dataplane and never cross control IPC or FFI."

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
