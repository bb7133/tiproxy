name: Dataplane integration topology

on:
  pull_request:
    paths:
      - ".github/workflows/dataplane-integration.yml"
      - "AGENTS.md"
      - "Makefile"
      - "tests/dataplane/integration/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dataplane-integration.yml"
      - "AGENTS.md"
      - "Makefile"
      - "tests/dataplane/integration/**"
  workflow_dispatch:
    inputs:
      mode:
        description: Dataplane implementation to launch
        required: true
        default: go
        type: choice
        options:
          - go
          - rust
      variant:
        description: Protocol variant
        required: true
        default: plain
        type: choice
        options:
          - plain
          - tls
          - proxy
          - compress-zlib
          - compress-zstd
          - tls-proxy-zstd
          - all
      t4_qualification:
        description: Record the immutable 48-cell T4 route-owner matrix
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dataplane-integration-${{ github.workflow }}-${{ github.ref }}
  # A formal matrix is an append-only recording attempt. A second dispatch
  # must not cancel one that is already collecting cells on the same ref.
  cancel-in-progress: ${{ !inputs.t4_qualification }}

jobs:
  framework:
    name: Validate topology framework
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run self-contained framework checks
        run: make dataplane-integration-self-test

  topology:
    name: Run ${{ inputs.mode }} / ${{ inputs.variant }} topology
    if: github.event_name == 'workflow_dispatch' && !inputs.t4_qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATAPLANE_ARTIFACT_ROOT: ${{ github.workspace }}/tests/dataplane/integration/artifacts
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install checksum-pinned TiUP
        run: |
          source tests/dataplane/integration/versions.env
          archive="$RUNNER_TEMP/tiup-v${TIUP_VERSION}-linux-amd64.tar.gz"
          install_root="$RUNNER_TEMP/tiup-v${TIUP_VERSION}"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/pingcap/tiup/releases/download/v${TIUP_VERSION}/tiup-v${TIUP_VERSION}-linux-amd64.tar.gz"
          echo "$TIUP_LINUX_AMD64_SHA256  $archive" | sha256sum -c -
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          "$install_root/bin/tiup" --version
          echo "$install_root/bin" >>"$GITHUB_PATH"
          # The release archive keeps its signed repository root at
          # <extract>/bin/root.json, which TiUP resolves through TIUP_HOME.
          echo "TIUP_HOME=$install_root" >>"$GITHUB_ENV"
      - name: Verify host prerequisites
        run: |
          command -v mysql
          mysql --version
          openssl version
      - name: Build the Rust executable for Rust preflight
        if: inputs.mode == 'rust'
        run: make rust-build
      - name: Run real TiDB topology
        run: tests/dataplane/integration/run.sh --mode "${{ inputs.mode }}" --variant "${{ inputs.variant }}"
      - name: Upload redacted diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataplane-${{ inputs.mode }}-${{ inputs.variant }}-${{ github.run_id }}
          path: tests/dataplane/integration/artifacts/*/diagnostics/**
          if-no-files-found: error
          retention-days: 14

  t4-qualification:
    name: Record immutable Rust route-owner matrix
    if: github.event_name == 'workflow_dispatch' && inputs.t4_qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact qualification ref and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Initialize immutable qualification evidence
        run: |
          artifact_root="$RUNNER_TEMP/t4-qualification-artifacts"
          mkdir -p "$artifact_root"
          echo "DATAPLANE_T4_ARTIFACT_ROOT=$artifact_root" >>"$GITHUB_ENV"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "github_sha=$GITHUB_SHA"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "platform=$(uname -sm)"
          } >"$artifact_root/ci-context.txt"
      - name: Install checksum-pinned TiUP
        run: |
          source tests/dataplane/integration/versions.env
          archive="$RUNNER_TEMP/tiup-v${TIUP_VERSION}-linux-amd64.tar.gz"
          install_root="$RUNNER_TEMP/tiup-v${TIUP_VERSION}"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/pingcap/tiup/releases/download/v${TIUP_VERSION}/tiup-v${TIUP_VERSION}-linux-amd64.tar.gz"
          echo "$TIUP_LINUX_AMD64_SHA256  $archive" | sha256sum -c -
          mkdir -p "$install_root"
          tar -xzf "$archive" -C "$install_root"
          "$install_root/bin/tiup" --version
          echo "$install_root/bin" >>"$GITHUB_PATH"
          echo "TIUP_HOME=$install_root" >>"$GITHUB_ENV"
      - name: Verify host prerequisites
        run: |
          test "$(uname -s)" = Linux
          command -v mysql
          mysql --version
          openssl version
      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          protoc --version
      - name: Record the complete 36-logical / 48-physical matrix
        run: |
          set -o pipefail
          design_root=$(cd "$GITHUB_WORKSPACE/../.." && pwd)
          mkdir -p "$design_root/notes"
          cp tests/dataplane/integration/tiproxy-223-design-final.md \
            "$design_root/notes/tiproxy-223-design-final.md"
          make dataplane-t4-qualification 2>&1 | \
            tee "$DATAPLANE_T4_ARTIFACT_ROOT/qualification.log"
      - name: Upload the immutable qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dataplane-t4-qualification-${{ github.run_id }}
          path: ${{ runner.temp }}/t4-qualification-artifacts
          if-no-files-found: error
          retention-days: 14
