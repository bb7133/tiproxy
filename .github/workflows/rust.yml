name: Rust

on:
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - "AGENTS.md"
      - "Makefile"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "go.mod"
      - "pkg/controlbridge/**"
      - "pkg/balance/**"
      - "lib/config/**"
      - "lib/go.mod"
      - "lib/go.sum"
      - "go.sum"
      - "proto/**"
      - "rust-toolchain.toml"
      - "rust/**"
      - "scripts/generate-control-proto.sh"
      - "tests/controlplane/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rust.yml"
      - "AGENTS.md"
      - "Makefile"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "go.mod"
      - "pkg/controlbridge/**"
      - "pkg/balance/**"
      - "lib/config/**"
      - "lib/go.mod"
      - "lib/go.sum"
      - "go.sum"
      - "proto/**"
      - "rust-toolchain.toml"
      - "rust/**"
      - "scripts/generate-control-proto.sh"
      - "tests/controlplane/**"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.20.2

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    # The complete existing mutation matrix already took nearly 38 minutes.
    # Its topology-dependent builds now include the collector; leave headroom
    # for those builds while keeping every older gate and the separate C job.
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Verify generated control protocol sources and goldens
        run: make control-proto-generate-check
      - name: Run Go control bridge tests
        run: go test -race ./pkg/controlbridge/...
      - name: Run CP-002 live external dependency evidence
        run: make controlplane-cp002-evidence
      - name: Run CP-ETCD live lease and election evidence
        run: make controlplane-cp003-evidence
      - name: Run CP-ETCD retained authority and compiling mutation evidence
        run: make controlplane-cp003-authority-evidence
      - name: Run CP-CFG/NS differential and real-etcd evidence
        run: make controlplane-cp004-evidence
      - name: Run CP-ROUTE config and namespace projection evidence
        run: make controlplane-cproute-evidence
      - name: Run CP-METRICS query and history evidence
        run: make controlplane-cpmetrics-evidence
      - name: Check formatting and Clippy
        run: make rust-lint
      - name: Run unit tests
        run: make rust-test
      - name: Run doc tests
        run: make rust-doc-test
      - name: Reject a stale lockfile
        run: cargo check --locked --workspace --manifest-path rust/Cargo.toml

  applied-metrics:
    name: Applied metrics material and transport evidence
    runs-on: ubuntu-24.04
    # Keep the existing CP-ROUTE/CP-METRICS gates intact and give the new
    # isolated real-etcd mutation build its own bounded execution budget.
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-metric-applied-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Run applied metrics live and compiling mutation evidence
        run: make controlplane-cpmetrics-applied-evidence

  collector-metrics:
    name: Metrics collector and mixed owner evidence
    runs-on: ubuntu-24.04
    # Run the complete collector evidence independently of the older quality job.
    # Each compiling mutant gets owned real etcd and an actual Go reader peer.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-metric-collector-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Run collector live and compiling mutation evidence
        run: make controlplane-cpmetrics-collector-evidence

  factor-metrics:
    name: Resource factor and producer evidence
    runs-on: ubuntu-24.04
    # Actual Go factors, real collector/ledger composition and compiling mutations.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-metric-factors-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Run factor observations, real producer and compiling mutations
        run: make controlplane-cpmetrics-factor-evidence

  resource-routing:
    name: Composed Resource and Location routing
    runs-on: ubuntu-24.04
    # Actual Go Group.Route, policy/query lifetimes, source windows and reservations.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-resource-routing-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Run composed reservations and compiling mutations
        run: make controlplane-cproute-resource-evidence

  migration-ledger:
    name: Migration ledger, factor pairs and physical order
    runs-on: ubuntu-24.04
    # Actual Go Group.Balance lifecycle, final admission lock and exact terminals.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-migration-ledger-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Run shared migration lifecycle and compiling mutations
        run: make controlplane-cproute-migration-evidence
      - name: Compare actual factor pairs and physical arrival order
        run: make controlplane-cproute-balance-evidence

  migration-worker:
    name: Migration worker timing, closure and ownership
    runs-on: ubuntu-24.04
    # Separate budget: shared Go clocks, real producer retirement and compiling faults.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-migration-worker-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Compare worker clocks, source lifecycle and compiling mutations
        run: make controlplane-cproute-worker-evidence

  routing-api:
    name: Router API differential adapter smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target
          key: rust-routing-api-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Compare the actual API adapters
        run: |
          python3 tests/controlplane/cproute/api-differential/run.py \
            tests/controlplane/cproute/api-differential/smoke.json \
            --output "${RUNNER_TEMP}/routing-api"
      - name: Preserve API inputs, outputs and first failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routing-api-${{ github.sha }}
          path: ${{ runner.temp }}/routing-api
          if-no-files-found: error

  routing-shadow:
    name: Read-only routing observation ledger and framing
    runs-on: ubuntu-24.04
    # Separate budget: real Go lifecycle, strict framing and compiling faults.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-routing-shadow-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Compare observation lifecycle, frame bounds and compiling mutations
        run: make controlplane-cproute-shadow-evidence

  routing-recorder:
    name: Actual routing capture, UDS consumer and sustained lifecycle
    runs-on: ubuntu-24.04
    # Separate budget: recorder faults, real UDS and fixed 60s workloads.
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-routing-recorder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Compare actual capture, bounded loss and compiling mutations
        run: make controlplane-cproute-recorder-evidence
      - name: Verify mixed capture leases and actual metrics read provenance
        run: make controlplane-cproute-read-foundation-evidence
      - name: Verify exact Go clocks and independent time arithmetic
        run: make controlplane-cproute-time-evidence

  routing-native:
    name: Native factor read windows, comparison and sustained coverage
    runs-on: ubuntu-24.04
    # Eighteen unchanged 60s policy windows plus native oracle and faults.
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Select repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/control-codegen
            bin/control-codegen-rust
            rust/target
          key: rust-routing-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Compare native factors and all nine enabled/disabled policies
        run: make controlplane-cproute-native-evidence

  supply-chain:
    name: Audit dependencies and policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Cargo and scanner caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            bin/rust-tools
          key: rust-supply-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}-${{ env.CARGO_AUDIT_VERSION }}-${{ env.CARGO_DENY_VERSION }}
      - name: Install pinned scanners
        run: make rust-install-tools
      - name: Enforce supply-chain policy
        run: make rust-supply-chain
      - name: Prove quality gates reject violations
        run: make rust-negative-tests

  release:
    name: Release (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Restore release cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target/${{ matrix.target }}
          key: rust-release-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('rust/Cargo.lock') }}
      - name: Build and verify release artifact
        id: build
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          version=$(git describe --tags --always)
          build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          make rust-release RUST_TARGET="$RUST_TARGET" VERSION="$version" COMMIT="$GITHUB_SHA" BUILD_TIME="$build_time"
          binary="rust/target/$RUST_TARGET/release/tiproxy-rs"
          rust/ci/verify-version.sh "$binary" "$version" "$GITHUB_SHA" "$build_time"
          mkdir -p dist
          cp "$binary" "dist/tiproxy-rs-linux-${{ matrix.arch }}"
          (
            cd dist
            sha256sum "tiproxy-rs-linux-${{ matrix.arch }}" >"tiproxy-rs-linux-${{ matrix.arch }}.sha256"
            sha256sum -c "tiproxy-rs-linux-${{ matrix.arch }}.sha256"
          )
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tiproxy-rs-linux-${{ matrix.arch }}
          path: |
            dist/tiproxy-rs-linux-${{ matrix.arch }}
            dist/tiproxy-rs-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 14
